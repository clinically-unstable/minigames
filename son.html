<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini-Game #4: Boss Fight</title>
<style>
:root{--bg:#c0c0c0;--fg:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}r
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2b2b;--fg:#eee}}
:root[data-theme="dark"]{--bg:#2b2b2b;--fg:#eee}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{display:flex;justify-content:center;align-items:center;overflow:hidden}
canvas{display:block;width:min(96vw,calc(96vh*800/540))!important;height:auto!important;box-shadow:0 0 0 3px #000;background:#fff}
</style>
</head>
<body>
<main id="stage"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
const W=800,H=540,GW=640,BOSS_HP=2000,MAX_HP=100,PANEL_X=652,PANEL_Y=44,ROW=54;
const eff=()=>max(5,100-g.deg);
const DL_T=300,DL_UP=10,DL_HEAL=10,FLIP_T=300;
const MSGS=["fight me","good job","uhh","vertical difficulty spike?","yikes"];
const SEQ=[
  ["aim","spread","gun","rain"],
  ["spread","wall","sweep","home","gun"],
  ["ring","wall","spiral","cross","bounce","curl"],
  ["fan","split","wall","gun","sweep","home","curl","bounce"],
  ["burst","spiral","wall","split","curl","sweep","cross","home","gun","bounce","wall"]];
const WAIT=[38,30,24,18,12];
const AUX=[[],[],["lane"],["lane"],["lane"]];
const LEAD=[0,.3,.45,.6,.7];
let bossC=null,bossErr=false,BW=250,BH=170,bx=GW/2,by=125,g,state="title",st=0,ji=0,aimMouse=false;

function setup(){
  pixelDensity(min(2,window.devicePixelRatio||1));
  createCanvas(W,H).parent("stage");
  drawingContext.imageSmoothingQuality="high";
  imageMode(CENTER);strokeJoin(ROUND);
  textFont("Comic Sans MS");
  const im=new Image();
  im.onload=()=>{BH=BW*im.naturalHeight/im.naturalWidth;bossC=downscale(im,BW*pixelDensity())};
  im.onerror=()=>{bossErr=true};
  im.src="mason.png";
  reset();
}

function reset(){
  g={hp:MAX_HP,bossHp:BOSS_HP,stage:0,deg:0,ver:0,btn:null,p:{x:GW/2,y:450,inv:0,vx:0,vy:0},
    bullets:[],shots:[],t:0,cool:0,itemT:240,msg:MSGS[0],msgT:90,hit:0,
    dl:null,flip:0,flipMax:1,note:"",noteT:0,m:{cast:null,atk:90,seq:0},x:{cast:null,atk:140,seq:0},bn:0,pf:0};
  aimMouse=false;
}
function begin(){reset();state="play";st=0}

function jit(i,a){const s=Math.sin(i*127.1+Math.floor(frameCount/7)*311.7)*43758.5453;return(s-Math.floor(s)-.5)*a}
function J(a){return jit(ji++,a)}
function wl(x1,y1,x2,y2,a=2){line(x1+J(a),y1+J(a),x2+J(a),y2+J(a))}
function wr(x,y,w,h,a=2){beginShape();vertex(x+J(a),y+J(a));vertex(x+w+J(a),y+J(a));vertex(x+w+J(a),y+h+J(a));vertex(x+J(a),y+h+J(a));endShape(CLOSE)}
function wc(x,y,r,a=2){beginShape();for(let i=0;i<12;i++){const t=i/12*TWO_PI;vertex(x+cos(t)*r+J(a),y+sin(t)*r+J(a))}endShape(CLOSE)}
function statCol(v){return v>80?"#22b14c":v>60?"#b5e61d":v>40?"#fff200":v>20?"#ff7f27":"#ed1c24"}

function draw(){
  ji=0;st++;
  if(!bossC){background(255);noStroke();fill(0);textAlign(CENTER,CENTER);textSize(24);
    text(bossErr?"can't find mason.png - keep it next to son.html":"loading...",W/2,H/2);return}
  background(255);
  if(state=="title"){title();return}
  if(state=="play")update();
  render();
  if(state!="play")overlay();
}

function put(x,y,a,v,o){if(o&&o.ed&&dist(x,y,g.p.x,g.p.y)<90)return;const b={x,y,vx:cos(a)*v,vy:sin(a)*v,r:7,...o};if(!b.col&&((g.bn+=.618)%1)<g.pf){b.inv=1;b.col="#a349a4"}g.bullets.push(b)}
function fire(a,v,o){put(bx,by+40,a,v,o)}
const aim=(v=3.2)=>{const p=g.p,t=Math.hypot(p.x-bx,p.y-by-40)/v*LEAD[g.stage];return atan2(constrain(p.y+p.vy*t,40,H-26)-by-40,constrain(p.x+p.vx*t,14,GW-14)-bx)};
const PAT={
  aim:[1,()=>{fire(aim(),3.2)}],
  spread:[1,()=>{for(let i=-1;i<2;i++){fire(aim()+i*.28,3.2)}}],
  fan:[1,()=>{for(let i=-2;i<3;i++){fire(aim(3.5)+i*.22,3.5)}fire(aim(4.5),4.5,{inv:1,col:"#a349a4"})}],
  ring:[1,()=>{for(let i=0;i<12;i++){fire(TWO_PI*i/12+g.t*.02,2.6)}}],
  burst:[1,()=>{for(let i=0;i<10;i++){fire(TWO_PI*i/10+g.t*.05,2.8)}fire(aim(4.2),4.2)}],
  gun:[40,t=>{if(t%(g.stage>3?4:5)==0){fire(aim(4.2),4.2,{r:6})}}],
  spiral:[100,t=>{if(t%4==0){for(let k=0;k<2;k++){fire(t*.16+k*PI,2.5)}}}],
  sweep:[60,(t,c)=>{if(t%4==0){fire(lerp(.15,.85,c.d?t/60:1-t/60)*PI,2.8)}}],
  curl:[40,t=>{if(t%20==0){for(let i=0;i<8;i++){fire(TWO_PI*i/8+t*.02,2.4,{w:t?-.011:.011,inv:1,col:"#a349a4"})}}}],
  rain:[140,t=>{if(t%7==0){const k=t/7;put(20+((k*137)%(GW-40)),30,PI/2,2.4+(k%3)*.4,{ed:1})}}],
  lane:[120,t=>{if(t%16==0){const k=t/16;put(40+((k*211)%(GW-80)),30,PI/2,2.2,{ed:1})}}],
  cross:[90,t=>{const v=g.stage>3?3.2:2.6;const y=60+((t*13)%(H-120));if(t%8==0){put(-8,y,0,v,{ed:1})}if(t%8==4){put(GW+8,H-y,PI,v,{ed:1})}}],
  wall:[1,(t,c)=>{const v=2+g.stage*.06,top=c.i%2==0,n=top?14:10,gw=g.stage<2?4:3,sp=1.2+eff()*.04,tt=((top?g.p.y-30:g.p.x+8)/v)-18,o=(c.i%4<2?-1:1)*constrain(tt*sp*.6,0,80),
    gp=constrain(round((top?g.p.x+o-17:g.p.y+o-66)/46-(gw-1)/2),0,n-gw);
    for(let i=0;i<n;i++){if(i<gp||i>=gp+gw){top?put(17+i*46,30,PI/2,v):put(-8,66+i*46,0,v)}}}],
  home:[1,()=>{const n=g.stage>2?3:2;for(let i=0;i<n;i++){fire(aim()+(i-(n-1)/2)*.7,1.8,{r:9,home:.035,hl:200,inv:1,col:"#a349a4"})}}],
  split:[1,()=>{for(let i=-1;i<2;i++){fire(aim(2.2)+i*.5,2.2,{r:11,sp:60,col:"#ff7f27"})}}],
  bounce:[1,()=>{for(const k of[-1.15,-.8,.8,1.15]){fire(PI/2+k,3.2,{bn:2})}}]
};

function runSlot(s,q,wait){
  let c=s.cast;
  if(!c){
    if(--s.atk>0)return;
    const i=s.seq++;
    c=s.cast={n:q[i%q.length],t:0,c:{i,d:i%2==0}};
    if(s===g.m){g.pf=[0,.25,.5][i%3]}
  }
  const P=PAT[c.n];
  P[1](c.t,c.c);
  if(++c.t>=P[0]){s.cast=null;s.atk=wait}
}
function bossAct(){
  runSlot(g.m,SEQ[g.stage],WAIT[g.stage]);
  if(AUX[g.stage].length){runSlot(g.x,AUX[g.stage],70)}
}

function hurt(virus){
  g.hp-=8+32*(1-eff()/100);
  g.p.inv=45;
  if(virus){const a=eff(),d=max(60,round(FLIP_T*(1-.8*a/100)));if(d>g.flip){g.flip=d;g.flipMax=d}}
  if(g.hp<=0){state="lose";st=0}
}

function note(t){g.note=t;g.noteT=90}
function grab(){
  if(g.dl)return note("only 1 update at a time!");
  if(g.deg<=0&&g.hp>=MAX_HP)return note("nothing to update");
  g.btn=null;g.itemT=360;g.dl={t:0};
}
const overBtn=(mx,my)=>g.btn&&abs(mx-g.btn.x)<36&&abs(my-g.btn.y)<16;
function update(){
  const p=g.p,e=eff();
  g.t++;
  const k=g.flip>0?-1:1;
  g.flip=max(0,g.flip-1);g.noteT--;
  const sp=(1.2+e*.04)*(g.dl?.6:1);
  const dx=k*((keyIsDown(68)||keyIsDown(RIGHT_ARROW))-(keyIsDown(65)||keyIsDown(LEFT_ARROW)));
  const dy=k*((keyIsDown(83)||keyIsDown(DOWN_ARROW))-(keyIsDown(87)||keyIsDown(UP_ARROW)));
  const m=Math.hypot(dx,dy)||1;
  const ox=p.x,oy=p.y;
  p.x=constrain(p.x+dx/m*sp,14,GW-14);
  p.y=constrain(p.y+dy/m*sp,40,H-26);
  p.vx+=(p.x-ox-p.vx)*.25;p.vy+=(p.y-oy-p.vy)*.25;
  p.inv=max(0,p.inv-1);
  g.hit=max(0,g.hit-1);
  bx=GW/2+sin(g.t*.012)*150+(g.hit?random(-3,3):0);
  by=125+sin(g.t*.05)*10;

  if(g.btn&&--g.btn.life<=0){g.btn=null;g.itemT=240}
  if(!g.btn&&--g.itemT<=0){g.btn={x:random(50,GW-50),y:random(70,H-40),life:300};g.itemT=360}
  if(g.dl){
    g.deg=max(0,g.deg-DL_UP/DL_T);
    g.hp=min(MAX_HP,g.hp+DL_HEAL/DL_T);
    if(++g.dl.t>=DL_T){g.dl=null;g.ver++;note("installed v1."+g.ver+"!")}
  }else{g.deg=min(100,g.deg+4/60)}

  g.cool--;
  if((aimMouse||keyIsDown(32))&&g.cool<=0){
    let a=aimMouse?atan2(mouseY-p.y,mouseX-p.x):atan2(by-p.y,bx-p.x);
    a+=random(-1,1)*(100-e)/100*.7;
    g.shots.push({x:p.x,y:p.y,vx:cos(a)*9,vy:sin(a)*9});
    g.cool=10;
  }

  const dmg=1+e*.09;
  g.shots=g.shots.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(abs(b.x-bx)<BW*.35&&abs(b.y-by)<BH*.5){g.bossHp-=dmg;g.hit=5;return false}
    return b.x>-10&&b.x<GW+10&&b.y>-10&&b.y<H+10;
  });

  const ns=min(4,floor((BOSS_HP-g.bossHp)/(BOSS_HP/5)));
  if(ns>g.stage){
    g.stage=ns;
    g.msg=MSGS[ns];g.msgT=120;g.m.atk=50;g.m.seq=0;g.x={cast:null,atk:140,seq:0};
  }
  if(g.bossHp<=0){state="win";st=0;return}

  bossAct();
  const old=g.bullets;g.bullets=[];
  for(const b of old){
    if(b.hl>0){b.hl--;const v=Math.hypot(b.vx,b.vy),c=atan2(b.vy,b.vx),d=atan2(p.y-b.y,p.x-b.x)-c,a=c+constrain(atan2(sin(d),cos(d)),-b.home,b.home);b.vx=cos(a)*v;b.vy=sin(a)*v}
    if(b.w){const cs=cos(b.w),sn=sin(b.w),x=b.vx;b.vx=x*cs-b.vy*sn;b.vy=x*sn+b.vy*cs}
    b.x+=b.vx;b.y+=b.vy;
    if(b.bn>0&&(b.x<b.r||b.x>GW-b.r)){b.vx*=-1;b.bn--;b.x=constrain(b.x,b.r,GW-b.r)}
    if(b.sp>0){b.sp--}
    if(b.sp===0&&dist(b.x,b.y,p.x,p.y)>90){for(let i=0;i<8;i++){put(b.x,b.y,TWO_PI*i/8+.15,2.2,{r:5})}continue}
    if(p.inv<=0&&dist(b.x,b.y,p.x,p.y)<b.r+11){hurt(b.inv);continue}
    if(b.x>-20&&b.x<GW+20&&b.y>-20&&b.y<H+20){g.bullets.push(b)}
  }
  if(p.inv<=0&&abs(p.x-bx)<BW*.3&&abs(p.y-by)<BH*.45){hurt()}
  g.msgT--;
}

function downscale(c,tw){
  let w=c.naturalWidth||c.width,h=c.naturalHeight||c.height,cur=c;
  while(w/2>=tw){const n=document.createElement("canvas");n.width=w=Math.round(w/2);n.height=h=Math.round(h/2);
    const x=n.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(cur,0,0,w,h);cur=n}
  return cur;
}
function drawBoss(x,y){drawingContext.drawImage(bossC,x-BW/2,y-BH/2,BW,BH)}

function drawBtn(){
  const b=g.btn;if(!b)return;
  stroke(0);strokeWeight(3);fill("#fff200");wr(b.x-34,b.y-14,68,28);
  noStroke();fill(0);textAlign(CENTER,CENTER);textSize(16);text("UPDATE",b.x,b.y+1);
  fill(0);rect(b.x-34,b.y+18,68*b.life/300,4);
  if(overBtn(mouseX,mouseY)){noFill();stroke("#3f48cc");strokeWeight(3);wr(b.x-39,b.y-19,78,38,1)}
}
function drawVirus(b){
  stroke(0);strokeWeight(2);fill(b.col||"#ed1c24");circle(b.x,b.y,b.r*2);
}

function drawPlayer(){
  const{x,y}=g.p;
  if(g.p.inv>0&&frameCount%8<4)return;
  stroke(0);strokeWeight(3);fill("#ffc90e");
  wc(x,y-16,9);
  stroke(g.flip>0?"#a349a4":"#00a2e8");
  wl(x,y-7,x,y+10);wl(x,y-2,x-11,y+5);wl(x,y-2,x+11,y+5);
  wl(x,y+10,x-8,y+22);wl(x,y+10,x+8,y+22);
  noStroke();fill(0);
  circle(x-3,y-17,3);circle(x+3,y-17,3);
}

function bar(x,y,w,l,f,c){
  noStroke();fill(0);textAlign(LEFT,BASELINE);textSize(14);text(l,x,y);
  stroke(0);strokeWeight(2);fill(255);rect(x,y+5,w,14);
  noStroke();fill(c);rect(x+1,y+6,(w-2)*f,12);
}

const UB={x:PANEL_X,y:355,w:138,h:26};
function panel(){
  const x=PANEL_X,y=PANEL_Y,w=138,b0=y+ROW*4,e=eff();
  noStroke();fill(0);textAlign(CENTER,BASELINE);textSize(24);
  text("Stats n stuf",x+w/2,y-12);
  stroke(0);strokeWeight(2);fill(255);wr(x,y,w,ROW*4,1);
  noStroke();fill(0);textAlign(CENTER,CENTER);textSize(18);text("DEGRADE",x+w/2,y+22);
  stroke(0);strokeWeight(2);fill(statCol(e));textSize(54);text(round(g.deg),x+w/2,y+76);
  stroke(0);strokeWeight(2);fill(255);rect(x+10,y+118,w-20,22);
  noStroke();fill(statCol(e));rect(x+11,y+119,(w-22)*g.deg/100,20);
  fill(0);textSize(13);text("Power  Speed",x+w/2,y+158);text("Durability  Accuracy",x+w/2,y+174);text("all at "+round(e)+"%",x+w/2,y+196);
  if(g.deg>=75&&frameCount%30<15){noFill();stroke("#ed1c24");strokeWeight(3);wr(x,y,w,ROW*4,1)}
  noStroke();fill(0);textAlign(LEFT,BASELINE);textSize(18);
  text("HP",x,b0+36);
  stroke(0);strokeWeight(2);fill(255);wr(x+34,b0+20,w-34,18,1);
  noStroke();fill("#22b14c");rect(x+36,b0+22,(w-38)*max(0,g.hp)/MAX_HP,14);
  fill(0);textSize(18);text("stage "+(g.stage+1)+"/5",x,b0+64);
  textSize(14);text("version 1."+g.ver,x,b0+90);
  const hot=!g.dl&&!!g.btn;
  stroke(0);strokeWeight(2);fill(hot?"#fff200":255);rect(UB.x,UB.y,UB.w,UB.h);
  if(g.dl){noStroke();fill("#22b14c");rect(UB.x+1,UB.y+1,(UB.w-2)*g.dl.t/DL_T,UB.h-2)}
  noStroke();fill(g.dl||hot?0:120);textAlign(CENTER,CENTER);textSize(14);
  text(g.dl?"updating "+floor(g.dl.t/DL_T*100)+"%":hot?"UPDATE ready!":"no update yet",UB.x+UB.w/2,UB.y+UB.h/2+1);
  bar(x,b0+150,w,g.flip>0?"INVERTED "+(g.flip/60).toFixed(1)+"s":"controls ok",g.flip/g.flipMax,"#a349a4");
  noStroke();textAlign(LEFT,BASELINE);textSize(12);
  if(g.noteT>0){fill("#ed1c24");text(g.note,x,b0+190)}
  fill(0);
  ["WASD = move","click/SPACE = shoot","click UPDATE button"].forEach((l,i)=>text(l,x,b0+210+i*15));
}

function render(){
  drawBoss(bx,by);
  if(g.hit){noStroke();fill("#ed1c24");textAlign(CENTER,CENTER);textSize(28);text("OW",bx+BW*.42,by-BH*.4)}

  g.bullets.forEach(drawVirus);
  drawBtn();
  stroke(0);strokeWeight(1);fill("#3f48cc");
  g.shots.forEach(b=>wc(b.x,b.y,4,1));
  drawPlayer();

  if(g.flip>0){noFill();stroke("#a349a4");strokeWeight(6);rect(3,3,GW-6,H-6)}
  const L=[];
  if(g.flip>0)L.push(["#a349a4","INVERTED "+(g.flip/60).toFixed(1)]);
  if(g.dl)L.push(["#000","updating "+floor(g.dl.t/DL_T*100)+"%"]);
  noStroke();textAlign(CENTER,CENTER);textSize(16);
  L.forEach((l,i)=>{fill(l[0]);text(l[1],constrain(g.p.x,60,GW-60),max(14,g.p.y-42-i*18))});
  if(g.msgT>0&&state=="play"){
    noStroke();fill("#ed1c24");textAlign(CENTER,CENTER);textSize(34);
    text(g.msg,GW/2+J(3),275+J(3));
  }

  noStroke();fill(0);textAlign(LEFT,CENTER);textSize(18);
  text("BOSS",8,22);
  stroke(0);strokeWeight(2);fill(255);wr(64,12,566,20,1);
  noStroke();fill("#ed1c24");rect(66,14,562*max(0,g.bossHp)/BOSS_HP,16);

  stroke(0);strokeWeight(2);
  wl(GW+4,0,GW+4,H,1);
  panel();
}

function title(){
  drawBoss(W/2,215);
  noStroke();fill(0);textAlign(CENTER,CENTER);
  textSize(54);text("BOSS FIGHT",W/2+J(2),55+J(2));
  textSize(20);text("Mini-Game #4",W/2,98);
  textSize(20);
  text("you degrade at a rate of 4/sec (higher = weaker everything)",W/2,322);
  text("click UPDATE before it vanishes (lowers degrade, heals a lil, slows u)",W/2,350);
  text("purple stuff invert ur controls (up to 5 sec)",W/2,378);
  text("WASD move / click or SPACE shoot",W/2,406);
  if(frameCount%60<40){fill("#ed1c24");textSize(30);text("click to start",W/2,465)}
}

function overlay(){
  noStroke();fill(255,255,255,210);rect(0,0,W,H);
  fill(state=="win"?"#22b14c":"#ed1c24");
  textAlign(CENTER,CENTER);textSize(64);
  text(state=="win"?"u win!!1":"u died lol",W/2+J(3),H/2-20+J(3));
  fill(0);textSize(22);text("click or R to retry",W/2,H/2+40);
}

function mousePressed(){
  if(state!="play"){if(st>30){begin()}return}
  if(overBtn(mouseX,mouseY)){grab();return}
  if(mouseX>=0&&mouseX<GW&&mouseY>=0&&mouseY<=H){aimMouse=true}
}
function mouseReleased(){aimMouse=false}

function keyPressed(){
  if(state!="play"&&st>30&&(key=="r"||key=="R"||keyCode==ENTER||keyCode==32)){begin()}
  if([32,37,38,39,40].includes(keyCode))return false;
}
</script>
</body>
