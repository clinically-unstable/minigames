function setup(){
  pixelDensity(1);
  createCanvas(W,H).parent("stage");
  drawingContext.imageSmoothingQuality="high";
  imageMode(CENTER);strokeJoin(ROUND);
  textFont("Comic Sans MS");
  BW=250;BH=bossImg&&bossImg.width>0?BW*bossImg.height/bossImg.width:250;
  reset();
}

function reset(){
  g={hp:MAX_HP,bossHp:BOSS_HP,stage:0,stats:[100,100,100,100],p:{x:GW/2,y:450,inv:0},
    bullets:[],shots:[],items:[],t:0,cool:0,atk:90,itemT:240,msg:MSGS[0],msgT:90,hit:0,
    dl:null,flip:0,flipMax:1,note:"",noteT:0,cast:null,last:""};
  aimMouse=false;
}
function begin(){reset();state="play";st=0}

function jit(i,a){const s=Math.sin(i*127.1+Math.floor(frameCount/7)*311.7)*43758.5453;return(s-Math.floor(s)-.5)*a}
function J(a){return jit(ji++,a)}
function wl(x1,y1,x2,y2,a=2){line(x1+J(a),y1+J(a),x2+J(a),y2+J(a))}
function wr(x,y,w,h,a=2){beginShape();vertex(x+J(a),y+J(a));vertex(x+w+J(a),y+J(a));vertex(x+w+J(a),y+h+J(a));vertex(x+J(a),y+h+J(a));endShape(CLOSE)}
function wc(x,y,r,a=2){beginShape();for(let i=0;i<12;i++){const t=i/12*TWO_PI;vertex(x+cos(t)*r+J(a),y+sin(t)*r+J(a))}endShape(CLOSE)}
function statCol(v){return v>80?"#22b14c":v>60?"#b5e61d":v>40?"#fff200":v>20?"#ff7f27":"#ed1c24"}

function draw(){
  ji=0;st++;
  background(255);
  if(state=="title"){title();return}
  if(state=="play")update();
  render();
  if(state!="play")overlay();
}

// ---------- boss attacks (every projectile is a virus) ----------
function put(x,y,a,v,o){g.bullets.push({x,y,vx:cos(a)*v,vy:sin(a)*v,r:7,...o})}
function fire(a,v,o){put(bx,by+40,a,v,o)}
const aim=()=>atan2(g.p.y-by-40,g.p.x-bx);
// name:[length in frames, step(t,state)]
const PAT={
  aim:[1,()=>fire(aim(),3.2)],
  spread:[1,()=>{for(let i=-1;i<2;i++)fire(aim()+i*.28,3.2)}],
  fan:[1,()=>{for(let i=-2;i<3;i++)fire(aim()+i*.22,3.5);fire(aim(),4.5,{inv:1,col:"#a349a4"})}],
  ring:[1,()=>{for(let i=0;i<12;i++)fire(TWO_PI*i/12+g.t*.02,2.6)}],
  burst:[1,()=>{for(let i=0;i<10;i++)fire(TWO_PI*i/10+g.t*.05,2.8);fire(aim(),4.2)}],
  gun:[40,t=>{if(t%(g.stage>3?4:5)==0)fire(aim(),4.2,{r:6})}],            // rapid aimed shots
  spiral:[100,t=>{const n=g.stage>3?3:2;if(t%3==0)for(let k=0;k<n;k++)fire(t*.16+k*TWO_PI/n,2.6)}],
  sweep:[60,(t,c)=>{if(t%3==0)fire(lerp(.15,.85,c.d?t/60:1-t/60)*PI,3)}],  // fan swept across the floor
  curl:[40,t=>{if(t%20==0)for(let i=0;i<8;i++)fire(TWO_PI*i/8+t*.02,2.4,{w:t?-.011:.011,inv:1,col:"#a349a4"})}], // curving rings
  rain:[140,t=>{if(t%6==0)for(let i=0;i<(g.stage>2?2:1);i++)put(random(20,GW-20),30,PI/2+random(-.1,.1),random(2.2,3.2))}],
  cross:[90,t=>{const v=g.stage>3?3.2:2.6;if(t%8==0)put(-8,random(60,H-40),0,v);if(t%8==4)put(GW+8,random(60,H-40),PI,v)}],
  wall:[1,()=>{const top=random()<.5,n=top?19:13,gp=floor(random(1,n-3)),gw=g.stage>3?2:3; // firewall with a gap
    for(let i=0;i<n;i++)if(i<gp||i>=gp+gw)top?put(17+i*34,30,PI/2,2):put(-8,66+i*34,0,2)}],
  home:[1,()=>{const n=g.stage>2?3:2;for(let i=0;i<n;i++)fire(aim()+(i-(n-1)/2)*.7,2,{r:9,home:.035,hl:200,inv:1,col:"#a349a4"})}],
  split:[1,()=>{for(let i=-1;i<2;i++)fire(aim()+i*.5,2.2,{r:11,sp:60,col:"#ff7f27"})}], // bursts into 8-10 viruses
  bounce:[1,()=>{for(const k of[-1.15,-.8,.8,1.15])fire(PI/2+k,3.2,{bn:2})}]
};

function bossAct(){
  let c=g.cast;
  if(!c){
    if(--g.atk>0)return;
    const pool=POOLS[g.stage].filter(n=>n!=g.last);
    g.last=pool[floor(random(pool.length))];
    c=g.cast={n:g.last,t:0,c:{d:random()<.5}};
  }
  const P=PAT[c.n];
  P[1](c.t,c.c);
  if(++c.t>=P[0]){g.cast=null;g.atk=WAIT[g.stage]}
}

function hurt(virus){
  g.hp-=4+16*(1-g.stats[2]/100);
  g.p.inv=45;
  if(virus){const a=g.stats.reduce((x,y)=>x+y)/4,d=max(60,round(FLIP_T*(1-.8*a/100)));if(d>g.flip){g.flip=d;g.flipMax=d}}
  if(g.hp<=0){state="lose";st=0}
}

// ---------- updates (the ? boxes) ----------
function note(t){g.note=t;g.noteT=90}
function grab(it){
  if(!it)return;
  if(g.dl)return note("only 1 update at a time!");
  if(g.hp>=MAX_HP&&g.stats.every(v=>v>=100))return note("nothing to update");
  it.dl=true;g.dl={item:it,t:0};
}
const overBox=i=>abs(i.x-mouseX)<22&&abs(i.y-mouseY)<22;

function update(){
  const p=g.p,s=g.stats;
  g.t++;
  const k=g.flip>0?-1:1;
  g.flip=max(0,g.flip-1);g.noteT--;
  const sp=1.2+s[1]*.04;
  const dx=k*((keyIsDown(68)||keyIsDown(RIGHT_ARROW))-(keyIsDown(65)||keyIsDown(LEFT_ARROW)));
  const dy=k*((keyIsDown(83)||keyIsDown(DOWN_ARROW))-(keyIsDown(87)||keyIsDown(UP_ARROW)));
  const m=Math.hypot(dx,dy)||1;
  p.x=constrain(p.x+dx/m*sp,14,GW-14);
  p.y=constrain(p.y+dy/m*sp,40,H-26);
  p.inv=max(0,p.inv-1);
  g.hit=max(0,g.hit-1);
  bx=GW/2+sin(g.t*.012)*150+(g.hit?random(-3,3):0);
  by=125+sin(g.t*.05)*10;

  if(--g.itemT<=0){
    if(g.items.length<2)g.items.push({x:random(40,GW-40),y:random(280,H-40),life:720,dl:false});
    g.itemT=360;
  }
  g.items.forEach(i=>{if(!i.dl)i.life--});
  g.items=g.items.filter(i=>i.dl||i.life>0);
  for(let i=0;i<4;i++)s[i]=max(5,s[i]-3/60); // stats drain 3 per second
  if(g.dl){ // background download: raises every lowered stat, no input needed
    for(let i=0;i<4;i++)s[i]=min(100,s[i]+DL_UP/DL_T);
    g.hp=min(MAX_HP,g.hp+DL_HEAL/DL_T);
    if(++g.dl.t>=DL_T){const d=g.dl.item;g.items=g.items.filter(i=>i!==d);g.dl=null;note("update installed!")}
  }

  g.cool--;
  if((aimMouse||keyIsDown(32))&&g.cool<=0){
    let a=aimMouse?atan2(mouseY-p.y,mouseX-p.x):atan2(by-p.y,bx-p.x);
    a+=random(-1,1)*(100-s[3])/100*.7;
    g.shots.push({x:p.x,y:p.y,vx:cos(a)*9,vy:sin(a)*9});
    g.cool=10;
  }

  const dmg=1+s[0]*.09;
  g.shots=g.shots.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(abs(b.x-bx)<BW*.35&&abs(b.y-by)<BH*.5){g.bossHp-=dmg;g.hit=5;return false}
    return b.x>-10&&b.x<GW+10&&b.y>-10&&b.y<H+10;
  });

  const ns=min(4,floor((BOSS_HP-g.bossHp)/(BOSS_HP/5)));
  if(ns>g.stage){
    g.stage=ns;
    g.msg=MSGS[ns];g.msgT=120;g.atk=70;
  }
  if(g.bossHp<=0){state="win";st=0;return}

  bossAct();
  const old=g.bullets;g.bullets=[];
  for(const b of old){
    if(b.hl>0){b.hl--;const v=Math.hypot(b.vx,b.vy),c=atan2(b.vy,b.vx),d=atan2(p.y-b.y,p.x-b.x)-c,a=c+constrain(atan2(sin(d),cos(d)),-b.home,b.home);b.vx=cos(a)*v;b.vy=sin(a)*v}
    if(b.w){const cs=cos(b.w),sn=sin(b.w),x=b.vx;b.vx=x*cs-b.vy*sn;b.vy=x*sn+b.vy*cs}
    b.x+=b.vx;b.y+=b.vy;
    if(b.bn>0&&(b.x<b.r||b.x>GW-b.r)){b.vx*=-1;b.bn--;b.x=constrain(b.x,b.r,GW-b.r)}
    if(b.sp&&--b.sp<=0){const n=g.stage>3?10:8;for(let i=0;i<n;i++)put(b.x,b.y,TWO_PI*i/n+random(.3),2.4,{r:5});continue}
    if(p.inv<=0&&dist(b.x,b.y,p.x,p.y)<b.r+11){hurt(b.inv);continue}
    if(b.x>-20&&b.x<GW+20&&b.y>-20&&b.y<H+20)g.bullets.push(b);
  }
  if(p.inv<=0&&abs(p.x-bx)<BW*.3&&abs(p.y-by)<BH*.45)hurt();
  g.msgT--;
}

// ---------- drawing ----------
function drawItem(i){
  if(!i.dl&&i.life<150&&frameCount%20<10)return;
  stroke(0);strokeWeight(3);fill(i.dl?"#22b14c":"#fff200");
  wr(i.x-16,i.y-16,32,32);
  noStroke();fill(0);textAlign(CENTER,CENTER);textSize(26);
  text(i.dl?"v":"?",i.x,i.y+1);
  if(i.dl){
    stroke(0);strokeWeight(2);fill(255);rect(i.x-18,i.y+20,36,7);
    noStroke();fill("#22b14c");rect(i.x-17,i.y+21,34*g.dl.t/DL_T,5);
  }else{
    textSize(11);text("update",i.x,i.y+26);
    if(overBox(i)){noFill();stroke("#3f48cc");strokeWeight(3);wc(i.x,i.y,26)}
  }
}

function drawVirus(b){
  stroke(0);strokeWeight(2);fill(b.col||"#ed1c24");circle(b.x,b.y,b.r*2);
}

function drawPlayer(){
  const{x,y}=g.p;
  if(g.p.inv>0&&frameCount%8<4)return;
  stroke(0);strokeWeight(3);fill("#ffc90e");
  wc(x,y-16,9);
  stroke(g.flip>0?"#a349a4":"#00a2e8");
  wl(x,y-7,x,y+10);wl(x,y-2,x-11,y+5);wl(x,y-2,x+11,y+5);
  wl(x,y+10,x-8,y+22);wl(x,y+10,x+8,y+22);
  noStroke();fill(0);
  circle(x-3,y-17,3);circle(x+3,y-17,3);
}

function bar(x,y,w,l,f,c){
  noStroke();fill(0);textAlign(LEFT,BASELINE);textSize(14);text(l,x,y);
  stroke(0);strokeWeight(2);fill(255);rect(x,y+5,w,14);
  noStroke();fill(c);rect(x+1,y+6,(w-2)*f,12);
}

function panel(){
  const x=PANEL_X,y=PANEL_Y,w=138,b0=y+ROW*4;
  noStroke();fill(0);textAlign(CENTER,BASELINE);textSize(24);
  text("Stats n stuf",x+w/2,y-12);
  stroke(0);strokeWeight(2);fill(255);wr(x,y,w,ROW*4,1);
  for(let i=0;i<4;i++){
    const ry=y+i*ROW,v=g.stats[i];
    stroke(0);strokeWeight(2);fill(statCol(v));
    wr(x+w-48,ry+3,44,ROW-6,1);
    if(i)wl(x,ry,x+w-48,ry,1.5);
    if(v<=25&&frameCount%30<15){noFill();stroke("#ed1c24");strokeWeight(3);wr(x+w-48,ry+3,44,ROW-6,1)}
    noStroke();fill(0);
    textAlign(LEFT,CENTER);textSize(15);text(NAMES[i],x+6,ry+ROW/2);
    textAlign(CENTER,CENTER);textSize(16);text(round(v),x+w-26,ry+ROW/2);
    if(g.dl&&v<100&&frameCount%30<20){fill("#22b14c");triangle(x+8,ry+ROW-10,x+20,ry+ROW-10,x+14,ry+ROW-22)}
  }
  noStroke();fill(0);textAlign(LEFT,BASELINE);textSize(18);
  text("HP",x,b0+36);
  stroke(0);strokeWeight(2);fill(255);wr(x+34,b0+20,w-34,18,1);
  noStroke();fill("#22b14c");rect(x+36,b0+22,(w-38)*max(0,g.hp)/MAX_HP,14);
  fill(0);textSize(18);text("stage "+(g.stage+1)+"/5",x,b0+64);
  bar(x,b0+92,w,g.dl?"UPDATE "+floor(g.dl.t/DL_T*100)+"%":"UPDATE idle",g.dl?g.dl.t/DL_T:0,"#22b14c");
  bar(x,b0+132,w,g.flip>0?"INVERTED "+(g.flip/60).toFixed(1)+"s":"controls ok",g.flip/g.flipMax,"#a349a4");
  noStroke();textAlign(LEFT,BASELINE);textSize(12);
  if(g.noteT>0){fill("#ed1c24");text(g.note,x,b0+176)}
  fill(0);
  ["WASD = move","click/SPACE = shoot","click ? or E = update"].forEach((l,i)=>text(l,x,b0+200+i*15));
}

function render(){
  g.items.forEach(drawItem);
  image(bossImg,bx,by,BW,BH);
  if(g.hit){noStroke();fill("#ed1c24");textAlign(CENTER,CENTER);textSize(28);text("OW",bx+BW*.42,by-BH*.4)}

  g.bullets.forEach(drawVirus);
  stroke(0);strokeWeight(1);fill("#3f48cc");
  g.shots.forEach(b=>wc(b.x,b.y,4,1));
  drawPlayer();

  if(g.flip>0){noFill();stroke("#a349a4");strokeWeight(6);rect(3,3,GW-6,H-6)}
  const L=[];
  if(g.flip>0)L.push(["#a349a4","INVERTED "+(g.flip/60).toFixed(1)]);
  if(g.dl)L.push(["#000","updating "+floor(g.dl.t/DL_T*100)+"%"]);
  noStroke();textAlign(CENTER,CENTER);textSize(16);
  L.forEach((l,i)=>{fill(l[0]);text(l[1],constrain(g.p.x,60,GW-60),max(14,g.p.y-42-i*18))});
  if(g.msgT>0&&state=="play"){
    noStroke();fill("#ed1c24");textAlign(CENTER,CENTER);textSize(34);
    text(g.msg,GW/2+J(3),275+J(3));
  }

  noStroke();fill(0);textAlign(LEFT,CENTER);textSize(18);
  text("BOSS",8,22);
  stroke(0);strokeWeight(2);fill(255);wr(64,12,566,20,1);
  noStroke();fill("#ed1c24");rect(66,14,562*max(0,g.bossHp)/BOSS_HP,16);

  stroke(0);strokeWeight(2);
  wl(GW+4,0,GW+4,H,1);
  panel();
}

function title(){
  image(bossImg,W/2,215,BW,BH);
  noStroke();fill(0);textAlign(CENTER,CENTER);
  textSize(54);text("BOSS FIGHT",W/2+J(2),55+J(2));
  textSize(20);text("Mini-Game #4",W/2,98);
  textSize(20);
  text("ur stats drop 3 every second",W/2,322);
  text("click a ? box to download an update (1 at a time)",W/2,350);
  text("purple viruses invert ur controls (up to 5 sec)",W/2,378);
  text("WASD move / click or SPACE shoot",W/2,406);
  if(frameCount%60<40){fill("#ed1c24");textSize(30);text("click to start",W/2,465)}
}

function overlay(){
  noStroke();fill(255,255,255,210);rect(0,0,W,H);
  fill(state=="win"?"#22b14c":"#ed1c24");
  textAlign(CENTER,CENTER);textSize(64);
  text(state=="win"?"u win!!1":"u died lol",W/2+J(3),H/2-20+J(3));
  fill(0);textSize(22);text("click or R to retry",W/2,H/2+40);
}

function mousePressed(){
  if(state!="play"){if(st>30)begin();return}
  if(mouseX<0||mouseX>=GW||mouseY<0||mouseY>H)return;
  const it=g.items.find(overBox);
  if(it)grab(it);else aimMouse=true;
}
function mouseReleased(){aimMouse=false}

function keyPressed(){
  if(state=="play"&&(key=="e"||key=="E"))grab(g.items.find(i=>!i.dl));
  if(state!="play"&&st>30&&(key=="r"||key=="R"||keyCode==ENTER||keyCode==32))begin();
  if([32,37,38,39,40].includes(keyCode))return false;
}
</script>
</body>
</html>
